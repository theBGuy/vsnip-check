name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec biome ci .

      - name: Type check
        run: pnpm run check-types

      # Unit tests for the pure scanner (src/scanner.ts) - includes ReDoS canaries that run every
      # scan regex against adversarial input in kill-timeouted child processes, so a reintroduced
      # catastrophic regex fails CI instead of freezing the editor's extension host.
      - name: Test
        run: pnpm test

      - name: Package
        run: pnpm exec vsce package
