name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec biome ci .

      - name: Type check
        run: pnpm run check-types

      # Unit tests for the pure scanner (src/scanner.ts) - includes ReDoS canaries that run every
      # SCANNER_REGEXES entry against adversarial input (backslash floods, unterminated-JSDoc
      # floods) in kill-timeouted child processes. Scope: a catastrophic regex REGISTERED there
      # fails CI instead of freezing the extension host; regexes outside the registry, or
      # pathologies unlike the battery's shapes, are not covered.
      - name: Test
        run: pnpm test

      - name: Package
        run: pnpm exec vsce package
