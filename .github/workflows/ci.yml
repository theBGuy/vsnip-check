name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec biome ci .

      - name: Type check
        run: pnpm run check-types

      # Package runs the full gate via vscode:prepublish (check-types, lint, clean compile, and
      # the unit tests incl. the ReDoS canaries - scope documented at the canary describe block
      # in src/test/scanner.test.ts). No separate Test step: it would run the same suite twice.
      - name: Package
        run: pnpm exec vsce package
